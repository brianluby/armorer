# Reviewed update proposals for exact pins. Every update is a pull request;
# nothing merges automatically. The cooldown keeps freshly published releases
# out until they have had time to be reported or yanked.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Pinned by the compiled Armorer catalog; moves only through `armorer upgrade`.
      - dependency-name: brianluby/armorer-workflows*

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
