name: Development

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          toolchain_bin="$(dirname "$(rustup which --toolchain 1.95.0 cargo)")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Qualify pinned native signature verifier
        run: python3 -I scripts/qualify-test-verifier.py --output-directory "$RUNNER_TEMP/armorer-fixture-gh" --github-env
      - name: Verify genuine signatures and adversarial fixtures
        run: cargo test --locked --test real_sigstore -- --ignored --test-threads=1
      - name: Build
        run: cargo build --locked
      - name: Verify committed schemas
        run: |
          for kind in config lock plan release-inventory verification-policy artifact-evidence evidence-requirements capability-config catalog capability-observation lifecycle-record github-receipt publish-set registry-receipt; do
            target/debug/armorer schema "$kind" > "/tmp/armorer-$kind.json"
            diff -u "schemas/$kind-v1.json" "/tmp/armorer-$kind.json"
          done
          target/debug/armorer schema cargo-graph-v2 > /tmp/armorer-cargo-graph-v2.json
          diff -u schemas/cargo-graph-v2.json /tmp/armorer-cargo-graph-v2.json
      - name: Independently validate example schemas
        run: |
          python3 -m venv /tmp/armorer-schema-venv
          /tmp/armorer-schema-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-schema.txt
          /tmp/armorer-schema-venv/bin/python scripts/validate-contract-examples.py
          /tmp/armorer-schema-venv/bin/python scripts/validate-graph-v2.py
