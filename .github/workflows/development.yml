name: Development

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact toolchain
        run: |
          toolchain="$(python3 -I -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text(encoding="utf-8"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt
          toolchain_bin="$(dirname "$(rustup which --toolchain "$toolchain" cargo)")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Reject genuine hardened ad-hoc Apple signatures
        if: runner.os == 'macOS'
        run: cargo test --locked real_hardened_adhoc_signature_cannot_satisfy_developer_id -- --ignored --test-threads=1
      - name: Stage pin-matched public Apple reference without execution
        if: runner.os == 'macOS'
        run: python3 -I scripts/qualify-test-apple-reference.py --output-directory "$RUNNER_TEMP/armorer-apple-reference" --github-env
      - name: Verify genuine Developer ID ticket and native adversaries
        if: runner.os == 'macOS'
        run: cargo test --locked real_public_developer_id_reference_and_native_adversaries -- --ignored --test-threads=1
      - name: Qualify pinned native signature verifier
        run: python3 -I scripts/qualify-test-verifier.py --output-directory "$RUNNER_TEMP/armorer-fixture-gh" --github-env
      - name: Verify genuine signatures and adversarial fixtures
        run: cargo test --locked --test real_sigstore -- --ignored --test-threads=1
      - name: Verify genuine public immutable release attestation and exact v0.2 subjects
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo test --locked --lib real_pinned_gh_release_attestation_matches_frozen_baseline -- --ignored --test-threads=1
      - name: Qualify native publication GETs and closed write boundaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo test --locked --lib real_native_publication_observations_never_grant_write_authority -- --ignored --test-threads=1
      - name: Qualify pinned native complete SBOM validator
        run: python3 -I scripts/qualify-test-sbom-validator.py --output-directory "$RUNNER_TEMP/armorer-fixture-cyclonedx" --github-env
      - name: Validate complete CycloneDX documents and adversarial fixtures
        run: cargo test --locked --test real_cyclonedx -- --ignored --test-threads=1
      - name: Reject unauthenticated inventories before metadata and asset processing
        run: cargo test --locked --test release_context real_inventory_authentication_failure_precedes_json_and_asset_processing -- --ignored --test-threads=1
      - name: Build
        run: cargo build --locked
      - name: Verify committed schemas
        run: |
          for kind in config lock plan release-inventory verification-policy artifact-evidence evidence-requirements capability-config catalog capability-observation lifecycle-record github-receipt publish-set registry-receipt ci-policy; do
            target/debug/armorer schema "$kind" > "$RUNNER_TEMP/armorer-$kind.json"
            diff -u "schemas/$kind-v1.json" "$RUNNER_TEMP/armorer-$kind.json"
          done
          target/debug/armorer schema bootstrap-plan > "$RUNNER_TEMP/armorer-bootstrap-plan.json"
          diff -u schemas/bootstrap-plan-v2.json "$RUNNER_TEMP/armorer-bootstrap-plan.json"
          for kind in upgrade-plan upgrade-rollback; do
            target/debug/armorer schema "$kind" > "$RUNNER_TEMP/armorer-$kind.json"
            diff -u "schemas/$kind-v1.json" "$RUNNER_TEMP/armorer-$kind.json"
          done
          target/debug/armorer schema cargo-graph-v2 > "$RUNNER_TEMP/armorer-cargo-graph-v2.json"
          diff -u schemas/cargo-graph-v2.json "$RUNNER_TEMP/armorer-cargo-graph-v2.json"
          target/debug/armorer schema verification-context > "$RUNNER_TEMP/armorer-verification-context-v1.json"
          diff -u schemas/verification-context-v1.json "$RUNNER_TEMP/armorer-verification-context-v1.json"
          for kind in native-catalog-v2 runtime-distribution-v1 verification-context-v2 verification-context-v3; do
            target/debug/armorer schema "$kind" > "$RUNNER_TEMP/armorer-$kind.json"
            diff -u "schemas/$kind.json" "$RUNNER_TEMP/armorer-$kind.json"
          done
          for kind in publication-policy publication-plan publication-approval; do
            target/debug/armorer schema "$kind" > "$RUNNER_TEMP/armorer-$kind.json"
            diff -u "schemas/$kind-v1.json" "$RUNNER_TEMP/armorer-$kind.json"
          done
      - name: Independently validate example schemas
        run: |
          python3 -m venv "$RUNNER_TEMP/armorer-schema-venv"
          "$RUNNER_TEMP/armorer-schema-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements-schema.txt
          "$RUNNER_TEMP/armorer-schema-venv/bin/python" scripts/validate-contract-examples.py
          "$RUNNER_TEMP/armorer-schema-venv/bin/python" scripts/validate-graph-v2.py
          "$RUNNER_TEMP/armorer-schema-venv/bin/python" scripts/validate-verification-context.py
          "$RUNNER_TEMP/armorer-schema-venv/bin/python" scripts/validate-runtime-native.py
          "$RUNNER_TEMP/armorer-schema-venv/bin/python" scripts/validate-bootstrap-examples.py
          "$RUNNER_TEMP/armorer-schema-venv/bin/python" scripts/validate-upgrade-examples.py
          "$RUNNER_TEMP/armorer-schema-venv/bin/python" scripts/test-review-gates.py
      - name: Checkout reviewed workflow lint runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brianluby/armorer-workflows
          ref: 772ca83e386c883c88cc3b936d69f8cb3216c91e
          path: workflow-tools-source
          persist-credentials: false
      - name: Authenticate native tools and audit development and caller workflows
        env:
          TOOL_DIRECTORY: ${{ runner.temp }}/armorer-workflow-tools
        run: |
          python3 -I - <<'PY'
          import os, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / "workflow-tools-source"))
          from armorer_runtime.tools import install_tools
          from armorer_runtime.ci import scan_workflows
          binaries = install_tools(Path(os.environ["TOOL_DIRECTORY"]), ["actionlint", "zizmor"])
          scan_workflows(root, binaries)
          scan_workflows(root / "examples/bootstrap-catalog", binaries)
          PY
          mv workflow-tools-source "$RUNNER_TEMP/armorer-reviewed-workflow-tools-source"
      - name: Build unprivileged native runtime candidate
        run: cargo build --locked --release
      - name: Stage native runtime observations
        run: python3 -I scripts/stage-runtime-candidate.py --output-directory "$RUNNER_TEMP/armorer-runtime-candidate"
      - name: Retain unprivileged native runtime candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-candidate-${{ matrix.os }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/armorer-runtime-candidate/armorer
            ${{ runner.temp }}/armorer-runtime-candidate/runtime-build.json
          archive: true
          if-no-files-found: error
          overwrite: false
          retention-days: 14
