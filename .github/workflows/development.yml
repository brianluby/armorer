name: Development

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          toolchain_bin="$(dirname "$(rustup which --toolchain 1.95.0 cargo)")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked
      - name: Verify committed schemas
        run: |
          for kind in config lock plan release-inventory verification-policy artifact-evidence evidence-requirements capability-config catalog capability-observation lifecycle-record github-receipt publish-set registry-receipt; do
            target/debug/armorer schema "$kind" > "/tmp/armorer-$kind.json"
            diff -u "schemas/$kind-v1.json" "/tmp/armorer-$kind.json"
          done
      - name: Independently validate example schemas
        run: |
          python3 -m venv /tmp/armorer-schema-venv
          /tmp/armorer-schema-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-schema.txt
          /tmp/armorer-schema-venv/bin/python scripts/validate-contract-examples.py
      - name: Checkout reviewed workflow lint runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brianluby/armorer-workflows
          ref: 772ca83e386c883c88cc3b936d69f8cb3216c91e
          path: workflow-tools-source
          persist-credentials: false
      - name: Authenticate native tools and audit development and caller workflows
        env:
          TOOL_DIRECTORY: ${{ runner.temp }}/armorer-workflow-tools
        run: |
          python3 -I - <<'PY'
          import os, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / "workflow-tools-source"))
          from armorer_runtime.tools import install_tools
          from armorer_runtime.ci import scan_workflows
          binaries = install_tools(Path(os.environ["TOOL_DIRECTORY"]), ["actionlint", "zizmor"])
          scan_workflows(root, binaries)
          scan_workflows(root / "examples/bootstrap-catalog", binaries)
          PY
