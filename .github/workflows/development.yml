name: Development

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          toolchain_bin="$(dirname "$(rustup which --toolchain 1.95.0 cargo)")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Qualify pinned native signature verifier
        run: python3 -I scripts/qualify-test-verifier.py --output-directory "$RUNNER_TEMP/armorer-fixture-gh" --github-env
      - name: Verify genuine signatures and adversarial fixtures
        run: cargo test --locked --test real_sigstore -- --ignored --test-threads=1
      - name: Qualify pinned native complete SBOM validator
        run: python3 -I scripts/qualify-test-sbom-validator.py --output-directory "$RUNNER_TEMP/armorer-fixture-cyclonedx" --github-env
      - name: Validate complete CycloneDX documents and adversarial fixtures
        run: cargo test --locked --test real_cyclonedx -- --ignored --test-threads=1
      - name: Reject unauthenticated inventories before metadata and asset processing
        run: cargo test --locked --test release_context real_inventory_authentication_failure_precedes_json_and_asset_processing -- --ignored --test-threads=1
      - name: Build
        run: cargo build --locked
      - name: Verify committed schemas
        run: |
          for kind in config lock plan release-inventory verification-policy artifact-evidence evidence-requirements capability-config catalog capability-observation lifecycle-record github-receipt publish-set registry-receipt; do
            target/debug/armorer schema "$kind" > "/tmp/armorer-$kind.json"
            diff -u "schemas/$kind-v1.json" "/tmp/armorer-$kind.json"
          done
          target/debug/armorer schema cargo-graph-v2 > /tmp/armorer-cargo-graph-v2.json
          diff -u schemas/cargo-graph-v2.json /tmp/armorer-cargo-graph-v2.json
          target/debug/armorer schema verification-context > /tmp/armorer-verification-context-v1.json
          diff -u schemas/verification-context-v1.json /tmp/armorer-verification-context-v1.json
          for kind in native-catalog-v2 runtime-distribution-v1 verification-context-v2; do
            target/debug/armorer schema "$kind" > "/tmp/armorer-$kind.json"
            diff -u "schemas/$kind.json" "/tmp/armorer-$kind.json"
          done
      - name: Independently validate example schemas
        run: |
          python3 -m venv /tmp/armorer-schema-venv
          /tmp/armorer-schema-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-schema.txt
          /tmp/armorer-schema-venv/bin/python scripts/validate-contract-examples.py
          /tmp/armorer-schema-venv/bin/python scripts/validate-graph-v2.py
          /tmp/armorer-schema-venv/bin/python scripts/validate-verification-context.py
          /tmp/armorer-schema-venv/bin/python scripts/validate-runtime-native.py
      - name: Build unprivileged native runtime candidate
        run: cargo build --locked --release
      - name: Stage native runtime observations
        run: python3 -I scripts/stage-runtime-candidate.py --output-directory "$RUNNER_TEMP/armorer-runtime-candidate"
      - name: Retain unprivileged native runtime candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-candidate-${{ matrix.os }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/armorer-runtime-candidate/armorer
            ${{ runner.temp }}/armorer-runtime-candidate/runtime-build.json
          archive: true
          if-no-files-found: error
          overwrite: false
          retention-days: 14
