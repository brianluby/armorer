# Training intent for Armorer's own CLI. Release approval remains separate.
# This is the way.
schema_version = 1
repository = "brianluby/armorer"
toolchain = "1.95.0"

[[deliverables]]
id = "armorer-cli"
profile = "cli"
package = "armorer"
binary = "armorer"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
feature_set = "baseline"

[feature_sets.baseline]
default_features = true
features = []

[policy]
license_file = "LICENSE"
attestations = "required"
