schema_version = 1
repository = "example/profile-workspace"
toolchain = "1.95.0"
manifest = "Cargo.toml"

[[deliverables]]
id = "core"
profile = "library"
package = "field-core"
targets = ["x86_64-unknown-linux-gnu"]
feature_set = "standard"

[[deliverables]]
id = "tool"
profile = "cli"
package = "field-tools"
binary = "field-tool"
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
feature_set = "standard"

[[deliverables]]
id = "daemon"
profile = "service"
package = "field-tools"
binary = "field-daemon"
targets = ["aarch64-unknown-linux-gnu"]
feature_set = "daemon"

[feature_sets.standard]
default_features = true
features = []

[feature_sets.daemon]
default_features = false
features = ["service"]

[policy]
license_file = "LICENSE"
attestations = "required"
