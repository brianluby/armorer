schema_version = 1
repository = "fixture/workspace"
toolchain = "1.95.0"

[[deliverables]]
id = "library"
profile = "library"
package = "core"
targets = ["x86_64-unknown-linux-gnu"]
feature_set = "minimal"

[[deliverables]]
id = "cli"
profile = "cli"
package = "app"
binary = "app"
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
feature_set = "minimal"

[[deliverables]]
id = "service"
profile = "service"
package = "service"
binary = "service"
targets = ["aarch64-unknown-linux-gnu"]
feature_set = "server"

[feature_sets.minimal]
default_features = false
features = []
[feature_sets.server]
default_features = true
features = ["json"]
[policy]
license_file = "LICENSE"
attestations = "required"
