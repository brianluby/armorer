[package]
name = "armorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Repeatable secure CI and verifiable releases for Rust repositories"
repository = "https://github.com/brianluby/armorer"
readme = "README.md"

[dependencies]
base64 = "=0.22.1"
clap = { version = "=4.6.7", features = ["derive"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["miniz_oxide"] }
schemars = "=1.2.1"
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=1.1.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework = { version = "=3.7.0", default-features = false, features = ["macos-12"] }
security-framework-sys = { version = "=2.17.0", default-features = false, features = ["macos-12"] }
