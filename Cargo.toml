[package]
name = "armorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Repeatable secure CI and verifiable releases for Rust repositories"
repository = "https://github.com/brianluby/armorer"
readme = "README.md"
include = ["src/**/*", "catalogs/bootstrap-tools-v1.json", "Cargo.toml", "README.md", "LICENSE"]

[features]
# ADR 0012 rule 3: catalog-to-catalog migration tests run against a test-only
# predecessor. Production builds cannot select bootstrap-v1.
test-predecessor = []
# Exposes byte-level parser wrappers for the cargo-fuzz targets in fuzz/. Never enabled by default.
fuzzing = []

[dev-dependencies]
armorer = { path = ".", features = ["test-predecessor"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[dependencies]
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["miniz_oxide"] }
rustix = { version = "=1.1.6", default-features = false, features = ["process", "fs", "std"] }
schemars = "=1.2.3"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=1.2.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework = { version = "=3.7.0", default-features = false, features = ["macos-12"] }
security-framework-sys = { version = "=2.17.0", default-features = false, features = ["macos-12"] }
