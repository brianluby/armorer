[package]
name = "armorer-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
armorer = { path = "..", features = ["fuzzing"] }

# Not part of the root package: fuzzing needs nightly and its own lockfile.
[workspace]

[[bin]]
name = "verification_json"
path = "fuzz_targets/verification_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_response"
path = "fuzz_targets/http_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trust_json"
path = "fuzz_targets/trust_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ci_policy"
path = "fuzz_targets/ci_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_toml"
path = "fuzz_targets/config_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lock_toml"
path = "fuzz_targets/lock_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sigstore_bundle"
path = "fuzz_targets/sigstore_bundle.rs"
test = false
doc = false
bench = false
